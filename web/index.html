<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Water Reminder</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #choices { position: fixed; left: 50%; display: flex; gap: 12px; transform: translate(-50%, 16px) scale(.85);
    opacity: 0; pointer-events: none; transition: transform .45s cubic-bezier(.34,1.56,.64,1), opacity .25s; }
  #choices.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
  button { font: 600 17px -apple-system, system-ui; letter-spacing: -.2px; padding: 13px 24px; border: 0; border-radius: 16px;
    cursor: pointer; transition: transform .18s cubic-bezier(.34,1.56,.64,1), filter .15s;
    box-shadow: 0 10px 30px rgba(0,0,0,.2), 0 1px 0 rgba(255,255,255,.5) inset; }
  button:hover { transform: scale(1.05); }
  button:active { transform: scale(.94); filter: brightness(.92); }
  #yes { background: #0a84ff; color: #fff; }
  #later { background: rgba(255,255,255,.85); color: #1c1c1e; backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="choices"><button id="yes">Yes 💧</button><button id="later">Remind me later</button></div>
<script>window.onerror = (m, u, l) => window.webkit?.messageHandlers?.app?.postMessage('err:' + m + ' @' + l);
window.onunhandledrejection = e => window.webkit?.messageHandlers?.app?.postMessage('err:' + e.reason);</script>
<script src="three.min.js"></script>
<script src="RoomEnvironment.js"></script>
<script>
// Memoji-style character built from primitives, animated procedurally (springs + simple physics),
// moving across a full-screen transparent overlay. World units are screen points, origin at screen centre.
const W = innerWidth, H = innerHeight;
const post = msg => window.webkit?.messageHandlers?.app?.postMessage(msg);

// ---------- renderer / camera / lighting ----------
// keeping the drawing buffer costs frame hitches; only --snapshot (which reads the canvas back) needs it
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: !!window.SNAPSHOT });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new THREE.RoomEnvironment(), 0.04).texture;
const FOV = 28, camDist = (H / 2) / Math.tan(THREE.MathUtils.degToRad(FOV / 2));
const camera = new THREE.PerspectiveCamera(FOV, W / H, 10, camDist * 3);
camera.position.set(0, 0, camDist);
const keyL = new THREE.DirectionalLight(0xfff1e0, 0.95); keyL.position.set(-0.7, 1, 1.1);
const rimL = new THREE.DirectionalLight(0xcfe3ff, 0.7); rimL.position.set(1, 0.6, -0.8);
scene.add(keyL, rimL, new THREE.HemisphereLight(0xffffff, 0x8a7a70, 0.3));

// ---------- materials & helpers ----------
const M = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.55, envMapIntensity: 0.22, ...o });
const skin = M(0xe89c70, { roughness: 0.55, clearcoat: 0.12, clearcoatRoughness: 0.6, sheen: 0.12, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xffc4a0) });
const skinDark = M(0xd88f6c, { roughness: 0.6 });
const hair = M(0x2b170a, { roughness: 0.45, clearcoat: 0.3, clearcoatRoughness: 0.35, sheen: 0.2, sheenColor: new THREE.Color(0x8a5a38) });
const hoodie = M(0x4b48e0, { roughness: 0.85, sheen: 0.15, sheenRoughness: 0.8, sheenColor: new THREE.Color(0x9c9bff) });
const hoodieDark = M(0x3532b0, { roughness: 0.9 });
const cord = M(0xf5f5f7, { roughness: 0.6 });
const pants = M(0x1b1d24, { roughness: 0.9, sheen: 0.1, sheenColor: new THREE.Color(0x555a66) });
const shoe = M(0xfdfdfd, { roughness: 0.35, clearcoat: 0.6 });
const sole = M(0xff375f, { roughness: 0.5 });
const sclera = M(0xffffff, { roughness: 0.08, clearcoat: 1, envMapIntensity: 0.6 });
const lash = M(0x1a0f08, { roughness: 0.5 });
const glint = new THREE.MeshBasicMaterial({ color: 0xffffff });
const mouthIn = M(0x4a0f19, { roughness: 0.7, side: THREE.DoubleSide });
const teethM = M(0xffffff, { roughness: 0.25, clearcoat: 0.6, side: THREE.DoubleSide });
const tongueM = M(0xe0607a, { roughness: 0.5, side: THREE.DoubleSide });
const lipM = M(0xd77a68, { roughness: 0.45, clearcoat: 0.3 });
const blushM = new THREE.MeshBasicMaterial({ color: 0xff7a8a, transparent: true, opacity: 0, depthWrite: false });
const tearM = M(0x8fdcff, { roughness: 0.03, clearcoat: 1, transparent: true, opacity: 0 });
const wood = M(0xc68a4e, { roughness: 0.6 });
const starM = new THREE.MeshBasicMaterial({ color: 0xffd60a, transparent: true, opacity: 0 });

// iris as a painted texture: dark limbal ring, warm brown, lighter flecks, big pupil
const irisTex = (() => {
  const c = Object.assign(document.createElement('canvas'), { width: 256, height: 256 }), g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 20, 128, 128, 128);
  gr.addColorStop(0, '#2a1608'); gr.addColorStop(0.32, '#7a4a24'); gr.addColorStop(0.7, '#5a3216'); gr.addColorStop(0.9, '#2e1a0c'); gr.addColorStop(1, '#1a0d05');
  g.fillStyle = gr; g.beginPath(); g.arc(128, 128, 128, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(200,140,80,.35)'; g.lineWidth = 3;
  for (let i = 0; i < 48; i++) { const a = i / 48 * Math.PI * 2; g.beginPath(); g.moveTo(128 + Math.cos(a) * 46, 128 + Math.sin(a) * 46); g.lineTo(128 + Math.cos(a) * 100, 128 + Math.sin(a) * 100); g.stroke(); }
  g.fillStyle = '#060302'; g.beginPath(); g.arc(128, 128, 44, 0, Math.PI * 2); g.fill();
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
})();
const irisM = new THREE.MeshPhysicalMaterial({ map: irisTex, roughness: 0.05, clearcoat: 1, transparent: true });

const sphere = (r, ws = 40, hs = 28) => new THREE.SphereGeometry(r, ws, hs);
const cap = (r, len) => new THREE.CapsuleGeometry(r, len, 12, 24);
function mesh(geo, mat, parent, [x, y, z] = [0, 0, 0], [sx, sy, sz] = [1, 1, 1]) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); parent.add(m); return m;
}
function pivot(parent, x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
// smooth rotationally-symmetric shape from a (radius, height) profile
const lathe = pts => new THREE.LatheGeometry(new THREE.SplineCurve(pts.map(([r, h]) => new THREE.Vector2(r, h))).getPoints(48), 48);
let seed = 7; const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- character rig ----------
// root sits at the feet; yaw turns him; tiltG pitches/rolls him together with his ride; body squashes/stretches from the feet.
const root = pivot(scene), yawG = pivot(root), tiltG = pivot(yawG), body = pivot(tiltG);
root.scale.setScalar(Math.min(1.05, H / 950));
const hips = pivot(body, 0, 92, 0);
function leg(side) {
  const hip = pivot(hips, side * 18, 0, 0);
  mesh(cap(15, 26), pants, hip, [0, -22, 0]);
  const knee = pivot(hip, 0, -44, 0);
  mesh(cap(13.5, 22), pants, knee, [0, -17, 0]);
  mesh(new THREE.TorusGeometry(12, 3, 10, 24), pants, knee, [0, -32, 0]).rotation.x = Math.PI / 2;
  const foot = pivot(knee, 0, -38, 0);
  mesh(sphere(14, 40, 24), shoe, foot, [0, 0, 9], [1, 0.72, 1.55]);
  mesh(new THREE.CylinderGeometry(14.5, 14.5, 5, 32), sole, foot, [0, -7, 9], [1, 1, 1.55]);
  mesh(sphere(5, 16, 12), sole, foot, [side * 13, 1, 9], [0.4, 1, 2.2]);
  return { hip, knee };
}
const legR = leg(-1), legL = leg(1);
const torso = pivot(hips);
// hoodie body: rounded, a bit wider at the chest, with hood, cords and kangaroo pocket
mesh(lathe([[0, -6], [30, -4], [41, 14], [44, 46], [43, 76], [37, 98], [20, 110], [0, 112]]), hoodie, torso, [0, 0, 0], [1, 1, 0.78]);
mesh(sphere(30, 40, 24), hoodie, torso, [0, 100, -20], [1.35, 0.75, 0.75]);
mesh(new THREE.TorusGeometry(19, 7, 16, 32), hoodieDark, torso, [0, 106, 2], [1, 1, 0.9]).rotation.x = Math.PI / 2.3;
for (const s of [-1, 1]) {
  mesh(new THREE.CylinderGeometry(1.6, 1.6, 30, 8), cord, torso, [s * 8, 84, 33.5]).rotation.z = s * 0.05;
  mesh(cap(2.6, 5), cord, torso, [s * 8.8, 67, 33.5]);
}
{
  const pocket = new THREE.Shape();
  pocket.moveTo(-26, 0); pocket.lineTo(26, 0); pocket.quadraticCurveTo(30, 16, 18, 26); pocket.lineTo(-18, 26); pocket.quadraticCurveTo(-30, 16, -26, 0);
  const p = mesh(new THREE.ExtrudeGeometry(pocket, { depth: 2, bevelThickness: 1.2, bevelSize: 1.2, bevelSegments: 3 }), hoodieDark, torso, [0, 18, 32.5]);
  p.rotation.x = -0.12;
}
function arm(side) {
  const sh = pivot(torso, side * 41, 88, 0);
  mesh(sphere(15), hoodie, sh, [0, -2, 0]);
  mesh(cap(13, 24), hoodie, sh, [0, -20, 0]);
  const el = pivot(sh, 0, -40, 0);
  mesh(cap(12, 20), hoodie, el, [0, -15, 0]);
  mesh(new THREE.TorusGeometry(10.5, 3.2, 10, 24), hoodieDark, el, [0, -29, 0]).rotation.x = Math.PI / 2;
  const hand = pivot(el, 0, -38, 0);
  mesh(sphere(11), skin, hand, [0, -1, 0], [1, 1.15, 0.8]);                 // palm
  const thumb = mesh(cap(4, 7), skin, hand, [-side * 9, 3, 4]); thumb.rotation.z = side * 0.8;
  mesh(cap(4.2, 10), skin, hand, [0, -11, 1], [1.9, 1, 0.9]);               // fingers (mitten)
  return { sh, el, hand };
}
const armR = arm(-1), armL = arm(1); // right hand (screen left) holds the banner pole
const neck = pivot(torso, 0, 106, 0);
mesh(new THREE.CylinderGeometry(14, 16, 22, 24), skin, neck, [0, 4, 0]);
const head = pivot(neck, 0, 12, 0);
const face = pivot(head, 0, 60, 4);
// head: big round cranium, fuller cheeks and a soft chin
mesh(sphere(62, 72, 56), skin, face, [0, 4, 0], [1, 1.02, 0.97]);
mesh(sphere(30, 48, 32), skin, face, [0, -26, 12], [1.45, 0.9, 1.1]);
for (const s of [-1, 1]) {
  const ear = pivot(face, s * 60, -2, -4);
  mesh(sphere(13), skin, ear, [0, 0, 0], [0.42, 1, 0.75]);
  mesh(sphere(8), skinDark, ear, [s * 1.6, 0, 1], [0.25, 0.75, 0.55]);
}
mesh(sphere(9.5), skin, face, [0, -9, 58], [1.05, 0.85, 0.8]);              // nose tip
for (const s of [-1, 1]) mesh(sphere(4), skin, face, [s * 7.5, -12, 56], [1, 0.8, 0.8]); // nostril wings
// hair: a scalp cap plus chunky sculpted clumps sweeping up and to the side (Memoji style)
const hairG = pivot(face, 0, 4, 0);
const hcap = mesh(new THREE.SphereGeometry(63, 64, 32, 0, Math.PI * 2, 0, Math.PI * 0.52), hair, hairG, [0, 0, -2], [1, 1.02, 0.98]);
hcap.rotation.x = -0.42;
mesh(sphere(61), hair, hairG, [0, -6, -10], [1.0, 0.95, 0.92]);
for (const s of [-1, 1]) mesh(sphere(16), hair, hairG, [s * 52, 10, 4], [0.5, 1.4, 1.1]); // sideburn area
for (let i = 0; i < 60; i++) {
  // chunky clumps on the scalp only (above the hairline), combed back and to the side; front ones sweep up into a quiff
  const p = Math.sqrt(rand()) * 1.25, a = rand() * Math.PI * 2;
  const n = new THREE.Vector3(Math.sin(p) * Math.cos(a), Math.cos(p), Math.sin(p) * Math.sin(a));
  if (n.y < 0.28 || (n.z > 0.45 && n.y < 0.62)) continue;
  const front = n.z > 0.3;
  const comb = front ? new THREE.Vector3(0.35, 1, 0.25) : new THREE.Vector3(0.55, 0.15, -0.8);
  const tangent = comb.sub(n.clone().multiplyScalar(n.dot(comb))).normalize();
  const m = mesh(sphere(1, 20, 14), hair, hairG, [n.x * 61, n.y * 62, n.z * 60], [11 + rand() * 5, 6 + rand() * 3, (front ? 20 : 26) + rand() * 10]);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().lookAt(new THREE.Vector3(), tangent, n));
}
function eye(side) {
  const g = pivot(face, side * 22, 4, 50);
  g.rotation.y = side * 0.3;
  const lid = pivot(g); // scaled on y to blink / squint
  mesh(sphere(14, 48, 32), sclera, lid, [0, 0, 0], [1, 1.12, 0.62]);
  const look = pivot(lid, 0, 0, 8.4);
  mesh(new THREE.CircleGeometry(10.5, 48), irisM, look, [0, 0, 0.2], [1, 1.08, 1]);
  mesh(sphere(2.6, 16, 12), glint, look, [3.4, 4.2, 1.4], [1, 1, 0.4]);
  mesh(sphere(1.2, 12, 8), glint, look, [-3.6, -3.4, 1.4], [1, 1, 0.4]);
  // upper lash line follows the lid
  const lashArc = mesh(new THREE.TorusGeometry(14.2, 1.9, 10, 40, Math.PI * 0.95), lash, lid, [0, 1, 1.5], [1, 1.12, 0.62]);
  lashArc.rotation.z = Math.PI * 0.025;
  // eyebrow: tapered, thick at the inner end
  const browP = pivot(face, side * 23, 26, 56);
  browP.rotation.y = side * 0.32;
  const bs = new THREE.Shape();
  bs.moveTo(-side * 12, -3.6); bs.quadraticCurveTo(0, -2.5, side * 13, -1.2); bs.quadraticCurveTo(side * 14, 1, side * 12, 1.4);
  bs.quadraticCurveTo(0, 3.2, -side * 12, 4); bs.quadraticCurveTo(-side * 14, 0, -side * 12, -3.6);
  mesh(new THREE.ExtrudeGeometry(bs, { depth: 3, bevelThickness: 1.4, bevelSize: 1.2, bevelSegments: 4, curveSegments: 16 }), hair, browP, [0, 0, -1.5]);
  const blush = mesh(new THREE.CircleGeometry(12, 32), blushM, face, [side * 34, -18, 50]);
  blush.rotation.y = side * 0.6;
  return { lid, look, browP };
}
const eyeR = eye(-1), eyeL = eye(1);
const mouth = pivot(face, 0, -30, 55.5);
mouth.rotation.x = 0.28;
const mouthMesh = new THREE.Mesh(new THREE.BufferGeometry(), mouthIn), teethMesh = new THREE.Mesh(new THREE.BufferGeometry(), teethM),
  tongueMesh = new THREE.Mesh(new THREE.BufferGeometry(), tongueM), lipMesh = new THREE.Mesh(new THREE.BufferGeometry(), lipM);
teethMesh.position.z = 0.3; tongueMesh.position.z = 0.2; lipMesh.position.z = -0.4;
mouth.add(lipMesh, mouthMesh, tongueMesh, teethMesh);
const tear = mesh(sphere(3.8, 20, 14), tearM, face, [-25, -8, 54], [1, 1.35, 1]);
const stars = pivot(face, 0, 78, 0);
for (let i = 0; i < 3; i++) mesh(new THREE.OctahedronGeometry(7), starM, stars, [Math.cos(i * 2.09) * 60, 0, Math.sin(i * 2.09) * 60], [1, 1, 0.45]);

// mouth: dark interior between an upper and lower curve, teeth along the top, tongue at the bottom,
// a soft lip rim around it. smile in [-1, 1], open in [0, 1]
let lastMouth = '';
function updateMouth(smile, open) {
  const k = smile.toFixed(3) + open.toFixed(3);
  if (k === lastMouth) return;
  lastMouth = k;
  const pos = Math.max(0, smile);
  const w = 14 + 9 * pos - 6 * open * (1 - pos);
  const top = -smile * 4.5;
  const bot = top - 2.6 - open * 22 - Math.max(0, smile - 0.4) * 13;
  const shape = (a, b, ww = w) => { const s = new THREE.Shape(); s.moveTo(-ww, 0); s.quadraticCurveTo(0, a * 2, ww, 0); s.quadraticCurveTo(0, b * 2, -ww, 0); return s; };
  const set = (m, g) => { m.geometry.dispose(); m.geometry = g; };
  set(mouthMesh, new THREE.ShapeGeometry(shape(top, bot), 20));
  set(lipMesh, new THREE.ShapeGeometry(shape(top + 2.2, bot - 2.4, w + 2.6), 20));
  const gap = bot - top;
  set(teethMesh, gap < -6 ? new THREE.ShapeGeometry(shape(top - 0.2, top + Math.max(gap * 0.32, -6), w * 0.92), 20) : new THREE.BufferGeometry());
  set(tongueMesh, gap < -10 ? new THREE.ShapeGeometry(shape(bot + Math.min(-gap * 0.45, 9), bot + 0.3, w * 0.6), 20) : new THREE.BufferGeometry());
}

// ---------- banner on a pole ----------
const boardCanvas = Object.assign(document.createElement('canvas'), { width: 1024, height: 512 });
const boardTex = new THREE.CanvasTexture(boardCanvas);
boardTex.encoding = THREE.sRGBEncoding;
boardTex.anisotropy = 8;
const banner = pivot(scene);
const bannerInner = pivot(banner);
mesh(new THREE.CylinderGeometry(3, 3, 250, 16), wood, bannerInner, [0, 95, 0]);
const board = pivot(bannerInner, 58, 270, 0);
const rr = (w, h, r) => { const s = new THREE.Shape(); s.moveTo(-w / 2 + r, -h / 2); s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
  s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2); s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
  s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2); return s; };
mesh(new THREE.ExtrudeGeometry(rr(250, 125, 22), { depth: 6, bevelThickness: 2, bevelSize: 2, bevelSegments: 4, curveSegments: 12 }), M(0xffffff, { roughness: 0.3, clearcoat: 0.6 }), board, [0, 0, -3]);
mesh(new THREE.PlaneGeometry(250, 125), new THREE.MeshBasicMaterial({ map: boardTex, transparent: true, toneMapped: false }), board, [0, 0, 5.2]);
// ctx.roundRect needs Safari 16's WebKit, which an unpatched macOS 12 doesn't have
const roundRect = (g, x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
function setBoard(text, color) {
  const g = boardCanvas.getContext('2d');
  g.clearRect(0, 0, 1024, 512);
  g.fillStyle = '#ffffff';
  roundRect(g, 6, 6, 1012, 500, 88); g.fill();
  g.lineWidth = 22; g.strokeStyle = color;
  roundRect(g, 22, 22, 980, 468, 74); g.stroke();
  g.fillStyle = '#1c1c1e'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '700 104px -apple-system, system-ui';
  const lines = text.split('\n');
  lines.forEach((l, i) => g.fillText(l, 512, 262 + (i - (lines.length - 1) / 2) * 128));
  boardTex.needsUpdate = true;
}

// soft contact shadow
const shadowCanvas = Object.assign(document.createElement('canvas'), { width: 128, height: 128 });
{ const g = shadowCanvas.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(0,0,0,.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }
const shadow = mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCanvas), transparent: true, depthWrite: false }), scene);

// ladder he climbs up when coming in from the bottom
const ladder = pivot(scene);
const RUNG = 38;
{
  const len = H + 200;
  for (const sx of [-46, 46]) mesh(new THREE.BoxGeometry(8, len, 9), wood, ladder, [sx, -len / 2, 0]);
  for (let ry = -16; ry > -len; ry -= RUNG) mesh(new THREE.CylinderGeometry(3.4, 3.4, 92, 12), wood, ladder, [0, ry, 0]).rotation.z = Math.PI / 2;
}
ladder.visible = false;
let ladderY = 0;

// ---------- rides (under tiltG, so they turn and tilt with him) ----------
const chrome = M(0xe8e8ec, { metalness: 1, roughness: 0.18, envMapIntensity: 1 });
const rubber = M(0x1a1a1c, { roughness: 0.9 });
const blackM = M(0x26262a, { roughness: 0.5 });
const paint = M(0x8c1426, { roughness: 0.3, metalness: 0.25, clearcoat: 1, clearcoatRoughness: 0.08 });
function rod(r, a, b, mat, parent) { // cylinder from point a to point b
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A);
  const m = mesh(new THREE.CylinderGeometry(r, r, d.length(), 12), mat, parent, A.add(B).multiplyScalar(0.5).toArray());
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return m;
}

// skateboard: long axis along x (he rides side-on, facing us), deck top at y≈13
const skate = pivot(tiltG), skateDeck = pivot(skate, 0, 11, 0);
{
  const deck = mesh(new THREE.ExtrudeGeometry(rr(124, 30, 14), { depth: 2.4, bevelThickness: 0.8, bevelSize: 0.8, bevelSegments: 2 }), M(0xff9f0a, { roughness: 0.45, clearcoat: 0.5 }), skateDeck, [0, -1.2, 0]);
  deck.rotation.x = -Math.PI / 2;
  mesh(new THREE.ShapeGeometry(rr(118, 26, 12)), blackM, skateDeck, [0, 2.1, 0]).rotation.x = -Math.PI / 2;
  for (const sx of [-40, 40]) {
    mesh(new THREE.BoxGeometry(12, 5, 22), chrome, skateDeck, [sx, -4, 0]);
    for (const sz of [-13, 13]) mesh(new THREE.CylinderGeometry(5.4, 5.4, 6, 20), M(0x63e6be, { roughness: 0.4 }), skateDeck, [sx, -6.6, sz]).rotation.x = Math.PI / 2;
  }
}

// surfboard: same stance as the skateboard, top at y≈10, plus the wave he rides (under root, so it doesn't yaw)
const surf = pivot(tiltG, 0, 6, 0);
mesh(sphere(1, 48, 20), M(0xfbfbfd, { roughness: 0.25, clearcoat: 1 }), surf, [0, 0, 0], [80, 3.6, 22]);
mesh(sphere(1, 40, 12), M(0x0a84ff, { roughness: 0.3, clearcoat: 1 }), surf, [0, 0.7, 0], [72, 3.3, 3.5]);

    if (wave.visible && waveAmp > 0.3 && !dbgRiding) {
      // spray off the tail of the board and foam blowing off the lip
      if (speed > 60 * S) for (let i = 0; i < 4; i++) emit(x - dir * 75 * S, y + 8 * S, (Math.random() - 0.4) * 40 * S,
        -dir * (80 + Math.random() * 220) * S, (160 + Math.random() * 280) * S, (Math.random() - 0.5) * 80 * S, (1.4 + Math.random() * 2.2) * S, 0.7, Math.random() < 0.5 ? 0xd8f6ff : 0x7fd4ff, { g: 0.6 });
      if (Math.random() < 0.6) emit(x + dir * (-15 - Math.random() * 70) * S, y + (140 + Math.random() * 40) * S * waveAmp, (-60 - Math.random() * 150) * S,
        dir * (40 + Math.random() * 100) * S, Math.random() * 80 * S, 0, (5 + Math.random() * 6) * S, 0.7, 0xffffff, { g: 0.2, drag: 2, grow: true });
    }
  } else wave.visible = false;

  if (isRide('bike')) {
    for (const w of bikeWheels) w.rotation.x += speed / (31 * S) * dt;
    // wheelie when leaving happy, nose dips while braking
    const wheelie = phase === 'exit-ride' && mood === 'happy' && phaseT > 1.0 && phaseT < 2.3 ? -0.3 : 0;
    pitch = ease(pitch, wheelie || 0.07 * skidding, wheelie ? 4 : 6, dt);
    enginePh += (4 + 14 * rpm) * dt * (engineOn ? 1 : 0);
    if (enginePh >= 1 && root.visible) { // exhaust puffs at the firing rate
      enginePh -= 1;
      exhaustTip.getWorldPosition(vtmp);
      emit(vtmp.x, vtmp.y, vtmp.z, -dir * (30 + Math.random() * 40) * S, (10 + Math.random() * 30) * S, 0, (5 + rpm * 5) * S, 0.9, 0xc8c8cc, { g: -0.04, drag: 2, grow: true });
    }
    if (skidding > 0.15 && Math.random() < 0.6) emit(x - dir * 55 * S, y + 3 * S, 0, -dir * Math.random() * 50 * S, Math.random() * 60 * S, 0, 6 * S, 0.6, 0xd9c7ab, { g: 0.05, drag: 3, grow: true });
  } else pitch = ease(pitch, 0, 6, dt);
  if (ride === 'bike') {
    // engine: idles at a low "dug-dug", revs blip up to "vroom", and while accelerating the revs climb and drop with each gear
    if (engineOn && !engineSnd) engineSnd = bikeEngine();
    revT = Math.max(0, revT - dt * 1.5);
    const sf = Math.min(1, Math.abs(vx) / (RIDES.bike.v * S));
    const accel = riding && skidding === 0 && Math.abs(vx) > 5 * S && Math.abs(vx) < cruise * 0.97;
    const target = !engineOn ? 0 : Math.min(1, (accel ? 0.3 + 0.7 * ((sf * 2.6) % 1) : 0.1 + 0.45 * sf) + revT * 0.85);
    rpm = ease(rpm, target, target > rpm ? 7 : 4, dt);
    const throttle = !engineOn ? 0 : target > rpm + 0.03 ? 1 : riding && skidding === 0 ? 0.35 : 0.05; // off the gas while braking / idling
    if (engineSnd) engineSnd.set(rpm, throttle, engineOn ? (phase === 'peek' ? 0.7 : 1) : 0, panOf(x));
  }
  if (ride === 'run' && skidding > 0.1 && Math.random() < 0.7) emit(x + dir * 10 * S, y + 3 * S, 10 * S, dir * Math.random() * 120 * S, Math.random() * 70 * S, 0, 7 * S, 0.6, 0xd9c7ab, { g: 0.05, drag: 3, grow: true });
  if (!isRide('skate') && ride !== 'surf') roll = ease(roll, 0, 8, dt);

  // --- parachute: canopy springs open, he swings under it; after landing it collapses behind him and fades
  if (chuteG.visible) {
    chuteOpenV += (-(chuteOpen - 1) * 140 - chuteOpenV * 8) * dt;
    chuteOpen += chuteOpenV * dt;
    if (phase === 'chute') chuteSway = Math.sin(phaseT * 2.3) * 0.13 * Math.min(1, phaseT) - vx * 0.0005 / S;
    else { chuteGone = Math.min(1, chuteGone + dt / 1.1); chuteSway = ease(chuteSway, 0, 5, dt); }
    const side = planeDir;
    chuteG.scale.set(chuteOpen, chuteOpen * (1 - 0.75 * chuteGone), chuteOpen);
    chuteG.rotation.z = -side * chuteGone * 1.25;
    chuteM.opacity = chuteLineM.opacity = 1 - chuteGone * chuteGone;
    if (chuteGone >= 1) chuteG.visible = false;
  } else chuteSway = ease(chuteSway, 0, 5, dt);

  // --- squash & stretch spring (stretch along vertical speed while airborne)
  const sqTarget = airborne && phase !== 'chute' ? 1 + THREE.MathUtils.clamp(Math.abs(vy) * 0.00022 / S, 0, 0.16) : 1;
  if (phase !== 'exit-crouch') squashV += (-(squash - sqTarget) * 260 - squashV * 13) * dt;
  squash += squashV * dt;
  bannerShowV += (-(bannerShow - bannerTarget) * 220 - bannerShowV * 14) * dt;
  bannerShow += bannerShowV * dt;

  // --- dance: hop on the beat, sway hips, arms pump (bounce in the saddle on the bike)
  let hop = 0, danceSway = 0, seatBounce = 0;
  const beat = phaseT / 0.44;
  if (phase === 'dance') {
    if (isRide('bike')) seatBounce = Math.max(0, Math.sin(beat * Math.PI)) * 7;
    else hop = Math.max(0, Math.sin(beat * Math.PI)) * 34 * S;
    danceSway = Math.sin(beat * Math.PI);
    yaw = targetYaw + Math.sin(beat * Math.PI * 0.5) * 0.35;
  }
  hop += ollie * 46 * S;

  // --- expressions (smoothed), blinking
  for (const k in ex) ex[k] = ease(ex[k], et[k], 9, dt);
  blinkT -= dt;
  if (blinkT < 0) { blinkT = 2.2 + Math.random() * 3; blinkAmt = 1; }
  blinkAmt = Math.max(0, blinkAmt - dt * 7);
  const blink = Math.sin(blinkAmt * Math.PI);
  if (phase !== 'peek') eyeX = ease(eyeX, 0, 6, dt);

  // ===== pose =====
  if (phase !== 'dance') yaw = ease(yaw, targetYaw, 6, dt);
  // tumbling while falling from the top, settling upright on landing
  tumble = phase === 'enter-fall' ? Math.sin(t * 5.5) * 0.35 : ease(tumble, 0, 10, dt);
  // the parachute swings him about the canopy, so shift his feet to keep the canopy steady
  root.position.set(x + Math.sin(chuteSway) * 330 * S, y + hop, 0);
  root.rotation.z = chuteSway;
  yawG.rotation.set(0, yaw, tumble - dir * lean);
  // ride tilt about the wheel / board end that stays on the ground
  if (isRide('bike')) {
    const zr = pitch < 0 ? -60 : 72; // wheelie pivots on the rear wheel, braking dips over the front
    tiltG.rotation.set(pitch, 0, 0); tiltG.position.set(0, zr * Math.sin(pitch), zr - zr * Math.cos(pitch));
  } else {
    const xr = -Math.sign(roll || 1) * 55 * (isRide('skate') ? 1 : 0);
    tiltG.rotation.set(0, 0, roll); tiltG.position.set(xr - xr * Math.cos(roll), -xr * Math.sin(roll), 0);
  }
  body.scale.set(1 / Math.sqrt(squash), squash, 1 / Math.sqrt(squash));
  const breathe = 1 + Math.sin(t * 2.2) * 0.012;
  torso.scale.set(breathe, breathe, breathe);

  const climbing = phase === 'enter-climb';
  const falling = phase === 'enter-fall' || (phase === 'exit-air' && exitTo === 'bottom');
  const reachA = Math.sin(climbPhase), reachB = -reachA; // which hand is reaching up
  const onBoard = isRide('skate') || isRide('surf'), onBike = isRide('bike');

  // legs
  const legSwing = 0.5 + 0.25 * run;
  for (const [L, ph, side] of [[legL, walkPhase, 1], [legR, walkPhase + Math.PI, -1]]) {
    let thigh = -Math.sin(ph) * legSwing * amp, knee = Math.max(0, Math.sin(ph - 1.1)) * (0.9 + 0.5 * run) * amp + 0.04, spread = 0;
    if (airborne && falling) { thigh = -0.25 + Math.sin(t * 11 + side) * 0.45; knee = 0.5 + Math.sin(t * 11 + side + 1) * 0.35; }
    else if (phase === 'chute') { thigh = -0.15 + Math.sin(t * 2.4 + side) * 0.18; knee = 0.3 + Math.sin(t * 2.4 + side + 1) * 0.15; }
    else if (airborne) { thigh = -0.8; knee = 1.2; }
    if (climbing) { const r = side > 0 ? reachB : reachA; thigh = -0.25 - Math.max(0, r) * 0.95; knee = 0.35 + Math.max(0, r) * 1.3; }
    if (phase === 'exit-crouch') { thigh = -0.6; knee = 1.1; }
    if (phase === 'dizzy') { thigh = -0.1; knee = 0.25 + Math.sin(t * 6 + side) * 0.1; }
    if (ride === 'run' && skidding > 0.1) { thigh = side === dir ? -0.55 : 0.2; knee = side === dir ? 0.2 : 0.6; } // front foot planted, skidding
    if (onBoard) {
      // side-on stance, knees soft (surfing crouches lower); the back foot swings out to push the skateboard
      const crouch = isRide('surf') && riding ? 0.55 : 0.2;
      thigh = -crouch * 0.8; knee = crouch * 1.5; spread = side * (isRide('surf') ? 0.2 : 0.13);
      if (side === -dir && push > 0) { spread += side * 0.45 * push; thigh = -0.05; knee = 0.1 + 0.25 * push; }
      if (ollie > 0) { thigh -= ollie * 0.6; knee += ollie * 1.1; }
    }
    if (phase === 'dance') { thigh = -Math.max(0, Math.sin(beat * Math.PI + (side > 0 ? 0 : Math.PI))) * 0.4; knee = -thigh * 1.4; }
    if (onBike) { thigh = -1.35; knee = 1.45; spread = side * 0.14; } // seated, feet on the pegs
    L.hip.rotation.x = ease(L.hip.rotation.x, thigh, 18, dt);
    L.knee.rotation.x = ease(L.knee.rotation.x, knee, 18, dt);
    L.hip.rotation.z = ease(L.hip.rotation.z, spread, 18, dt);
  }
  // body height: walking bob, planted on the board, or sat in the saddle
  if (onBoard) body.position.y = (isRide('surf') ? 9.6 : 13) - (91.5 - Math.max(legReach(legL), legReach(legR)));
  else if (onBike) body.position.y = -1 + seatBounce;
  else body.position.y = !airborne ? Math.abs(Math.cos(walkPhase)) * 5 * amp : 0;
  hips.rotation.y = Math.sin(walkPhase) * 0.08 * amp;
  hips.rotation.z = danceSway * 0.12 + (phase === 'dizzy' ? Math.sin(t * 6) * 0.06 : 0);
  torso.rotation.z = -danceSway * 0.1 + (climbing ? reachA * 0.06 : 0);
  torso.rotation.x = 0.05 * amp + 0.12 * run + ex.droop * 0.18 - (climbing ? 0.08 : 0)
    - (ride === 'run' ? skidding * 0.35 : 0) + (onBike && riding ? 0.22 : 0) + (onBoard && riding ? 0.1 : 0);

  // arms: rotation.z swings the arm out sideways (+ for the left arm, - for the right), x swings it forward
  const sideArm = (A, side, sz, sx, ez, ex2, k = 14) => {
    A.sh.rotation.z = ease(A.sh.rotation.z, side * sz, k, dt);
    A.sh.rotation.x = ease(A.sh.rotation.x, sx, k, dt);
    A.el.rotation.z = ease(A.el.rotation.z, side * ez, k, dt);
    A.el.rotation.x = ease(A.el.rotation.x, ex2, k, dt);
  };
  const toBars = (A, side) => sideArm(A, side, 0.32, -1.05, 0, -0.6, 12);
  if (climbing) {
    // hand over hand: the reaching arm goes straight up, the pulling arm bends down to the shoulder
    for (const [A, side, r] of [[armL, 1, reachB], [armR, -1, reachA]]) {
      const reach = 0.5 + 0.5 * Math.tanh(3 * r);
      sideArm(A, side, 0.28, -(2.05 + reach * 0.95), 0, -(1 - reach) * 1.2, 20);
    }
  } else if (falling && airborne) {
    for (const [A, side, o] of [[armL, 1, 0], [armR, -1, 1.7]]) sideArm(A, side, 2.3 + Math.sin(t * 13 + o) * 0.45, 0, Math.sin(t * 13 + o + 1) * 0.5, 0, 16);
  } else if (phase === 'chute' || (phase === 'land' && chuteGone < 0.3)) {
    for (const [A, side] of [[armL, 1], [armR, -1]]) sideArm(A, side, 2.55, 0, 0.3, 0, 12); // holding the lines
  } else if (onBike && riding) {
    toBars(armL, 1); toBars(armR, -1);
  } else if (isRide('surf') && riding) {
    for (const [A, side, o] of [[armL, 1, 0], [armR, -1, 1]]) sideArm(A, side, 1.2 + Math.sin(t * 2.4 + o) * 0.15, 0.15, 0.3, -0.25, 10); // arms out for balance
  } else {
    // right arm holds the pole out to the side; lifts it high when dancing
    const lift = phase === 'dance' ? 0.35 + Math.max(0, Math.sin(beat * Math.PI)) * 0.25 : 0;
    sideArm(armR, -1, 0.5 + lift * 0.6 - ex.droop * 0.25 + (onBike ? 0.75 : 0), -0.15 - lift, 0, -1.35 + lift * 0.4 + ex.droop * 0.35, 16);
    // left arm: swing while walking, wave when greeting, pump when dancing, balance on the skateboard, rest on the bars on the bike
    let lsz = 0.14 - ex.droop * 0.06, lsx = Math.sin(walkPhase) * (0.45 + 0.4 * run) * amp, lez = 0, lex = -0.15 - 0.9 * run * amp;
    if (ride === 'run' && skidding > 0.1) { lsz = 1.4; lsx = -0.4; lez = 0.4; lex = -0.3; }
    if (onBoard && riding) { lsz = 0.95 + Math.sin(t * 2) * 0.1; lsx = 0; lez = 0.35; lex = -0.2; }
    if (onBike) { lsz = 0.32; lsx = -1.05; lez = 0; lex = -0.6; }
    if (phase === 'greet') { const w = Math.min(1, phaseT / 0.25); lsz = 0.14 + w * 2.45; lsx = 0; lez = Math.sin(phaseT * 14) * 0.45 * w; lex = 0; }
    if (phase === 'dance') { lsz = 2.3 + Math.sin(beat * Math.PI) * 0.4; lsx = 0; lez = Math.sin(beat * 2 * Math.PI) * 0.5; lex = 0; }
    if (airborne) { lsz = 2.2; lsx = 0; lez = 0.3; lex = 0; }
    if (phase === 'dizzy') { lsz = 0.5; lsx = Math.sin(t * 6) * 0.2; lez = 0; lex = -0.3; }
    sideArm(armL, 1, lsz, lsx, lez, lex);
  }

  // head: keep the face towards the viewer, tilt, droop, shake "no" when moping, nod on the beat, wobble when dizzy
  const shake = phase === 'mope' ? Math.sin(phaseT * 7) * 0.32 * Math.max(0, 1 - phaseT / 1.8) : 0;
  const nod = phase === 'dance' ? Math.sin(beat * 2 * Math.PI) * 0.08 : 0;
  const wob = phase === 'dizzy' ? 0.16 * Math.max(0, 1 - phaseT / 1.4) : 0;
  head.rotation.set(ex.droop * 0.32 + nod - (climbing ? 0.3 : airborne ? 0.12 : 0) - (onBike && riding ? 0.2 : 0) + Math.sin(t * 7) * wob,
    (Math.abs(yaw) > 1.6 ? 0 : -yaw * (onBike ? 0.7 : 0.55)) + shake + eyeX * 0.15, ex.tilt + Math.cos(t * 7) * wob + dir * lean * 0.5);
  stars.rotation.y = t * 4;
  starM.opacity = phase === 'dizzy' ? Math.min(1, 3 * (1.3 - phaseT)) : 0;

  // face
  for (const [E, s] of [[eyeR, -1], [eyeL, 1]]) {
    E.lid.scale.y = Math.max(0.06, ex.eye * (1 - ex.squint * 0.72) * (1 - blink * 0.92));
    E.lid.scale.x = ex.eye;
    E.lid.position.y = -ex.squint * 2;
    const spin = phase === 'dizzy' ? 2.2 : 0;
    E.look.position.set(-yaw * 3.4 + eyeX * 3.6 + Math.cos(t * 9 * s) * spin, ex.lookY * 3 + Math.sin(t * 9 * s) * spin, 8.4);
    E.browP.position.y = 26 + ex.browUp * 5 - ex.squint * 2;
    E.browP.rotation.z = s * -ex.brow * 0.38 + s * ex.squint * 0.12;
  }
  updateMouth(ex.smile, ex.open);
  blushM.opacity = ex.blush * 0.38;
  const tearCycle = (phaseT % 1.4) / 1.4;
  tearM.opacity = phase === 'mope' || (phase === 'exit-ride' && mood === 'sad') ? Math.sin(tearCycle * Math.PI) * 0.9 : 0;
  tear.position.y = -8 - tearCycle * 26;

  // banner follows the right hand with a lagging sway; tucked away while climbing / riding, pops out on arrival
  root.updateMatrixWorld(true);
  armR.hand.getWorldPosition(vtmp);
  banner.position.set(vtmp.x, vtmp.y - 12 * S, vtmp.z);
  swayV += (-(sway - (-vx * 0.0009 / S + danceSway * 0.12 + tumble * 0.5)) * 90 - swayV * 9) * dt;
  sway += swayV * dt;
  banner.rotation.set(0, yaw * 0.45, sway + Math.sin(t * 2.4) * 0.015);
  bannerInner.scale.setScalar(Math.max(0.0001, bannerShow));
  banner.visible = bannerShow > 0.02 && root.visible;

  // contact shadow: only on the "floor" he stands on, shrinking with height; longer under the bike
  const air = Math.max(0, (root.position.y - ground) / (300 * S)), long = isRide('bike') ? 1.9 : onBoard ? 1.25 : 1;
  shadow.position.set(x, ground - 2, -10);
  shadow.scale.set(130 * S * long * (1 - Math.min(0.6, air)), 34 * S * (1 - Math.min(0.6, air)), 1);
  shadow.material.opacity = !root.visible || phase === 'peek' || climbing || (isRide('surf') && waveAmp > 0.1) || root.position.y < ground - 5 ? 0 : 1 - Math.min(0.8, air);

  updateParts(dt, G);
  renderer.render(scene, camera);
}

// Warm up while the window is still hidden: compile every shader and upload every mesh/texture now, otherwise
// the first entrance frame stalls for seconds. Everything that is normally hidden is shown for this one render.
{
  const hidden = [ladder, skate, surf, wave, bike, plane, chuteG];
  emit(0, 0, 0, 1, 1, 0, 10, 0.1, 0xffffff, { grow: true });
  hidden.forEach(o => { o.visible = true; });
  updateMouth(1, 1); emit(0, 0, 0, 0, 0, 0, 10, 0.1, 0xffffff); updateParts(0, 0);
  renderer.compile(scene, camera);
  renderer.render(scene, camera);
  renderer.getContext().finish();
  hidden.forEach(o => { o.visible = false; }); parts[0].life = 0; updateParts(0, 0);
  renderer.clear();
}
post('ready');
</script>
</body>
</html>
